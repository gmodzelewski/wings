# API key for the ReAct agent (in-cluster vLLM does not require a real key).
# install.sh applies this as Secret wings-react-agent (or copies from this example).
apiVersion: v1
kind: Secret
metadata:
  name: wings-react-agent
  namespace: my-first-model
  labels:
    app.kubernetes.io/part-of: wings-demo
    app.kubernetes.io/component: react-agent
stringData:
  api-key: not-needed
type: Opaque
