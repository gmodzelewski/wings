spec:
  replicas: 1
  selector:
    matchLabels:
      app: wings3-guarded-llm
  template:
    metadata:
      labels:
        app: wings3-guarded-llm
    spec:
      containers:
        - name: stub
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["python3", "/app/server.py"]
          env:
            - name: DEMO_STUB_MODE
              value: refuse
            - name: DEMO_STUB_MODEL
              value: qwen36-35b-a3b
            - name: DEMO_STUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wings3-maas-upstream-api-key
                  key: api-key
                  optional: true
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: stub
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: stub
          configMap:
            name: wings3-demo-openai-stub
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: wings3-guarded-llm
  namespace: nemo-quickstart
  labels:
    app: wings3-guarded-llm
    app.kubernetes.io/part-of: wings3-demo
spec:
  selector:
    app: wings3-guarded-llm
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: wings3-unguarded-llm
  namespace: nemo-quickstart
  labels:
    app: wings3-unguarded-llm
    app.kubernetes.io/part-of: wings3-demo
spec:
  to:
    kind: Service
    name: wings3-unguarded-llm
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
