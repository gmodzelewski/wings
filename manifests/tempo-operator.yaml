# Tempo Operator — provides the TempoStack/TempoMonolithic CRDs that the
# RHOAI operator's Monitoring controller requires for distributed tracing.
# Without this operator, the Monitoring CR cannot provision tracing
# infrastructure (DSCI spec.monitoring.traces).
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-tempo-operator
  labels:
    app.kubernetes.io/part-of: wings-demo
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-tempo-operator
  namespace: openshift-tempo-operator
  labels:
    app.kubernetes.io/part-of: wings-demo
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: tempo-product
  namespace: openshift-tempo-operator
  labels:
    app.kubernetes.io/part-of: wings-demo
spec:
  channel: stable
  installPlanApproval: Automatic
  name: tempo-product
  source: redhat-operators
  sourceNamespace: openshift-marketplace
