# Lab-only HTTP→HTTPS proxy so EvalHub/Garak pods can call NeMo without
# trusting the service-serving cert or using the external Route.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wings3-nemo-http-proxy
  namespace: nemo-quickstart
  labels:
    app.kubernetes.io/part-of: wings3-demo
data:
  proxy.py: |
    #!/usr/bin/env python3
    import http.client
    import os
    import ssl
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM = os.environ.get("UPSTREAM_HOST", "nemoguardrails.nemo-quickstart.svc.cluster.local")
    UPSTREAM_PORT = int(os.environ.get("UPSTREAM_PORT", "443"))
    CA = os.environ.get("SSL_CERT_FILE", "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt")
    TOKEN_FILE = os.environ.get(
        "TOKEN_FILE",
        "/var/run/secrets/kubernetes.io/serviceaccount/token",
    )

    def _ctx():
        ctx = ssl.create_default_context(cafile=CA if os.path.exists(CA) else None)
        if not os.path.exists(CA):
            ctx.check_hostname = False
            ctx.verify_mode = ssl.CERT_NONE
        return ctx

    def _sa_token():
        try:
            with open(TOKEN_FILE) as f:
                return f.read().strip()
        except OSError:
            return ""

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            print("[%s] %s" % (self.log_date_time_string(), fmt % args), flush=True)

        def do_GET(self):
            if self.path in ("/health", "/healthz", "/readyz"):
                body = b'{"status":"ok"}'
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return
            self._proxy()

        def do_POST(self):
            self._proxy()

        def do_OPTIONS(self):
            self._proxy()

        def _proxy(self):
            length = int(self.headers.get("Content-Length") or 0)
            body = self.rfile.read(length) if length else b""
            headers = {k: v for k, v in self.headers.items() if k.lower() not in ("host", "content-length")}
            # NeMo kube-rbac-proxy expects a ServiceAccount Bearer token.
            tok = _sa_token()
            if tok:
                headers["Authorization"] = f"Bearer {tok}"
            conn = http.client.HTTPSConnection(UPSTREAM, UPSTREAM_PORT, context=_ctx(), timeout=120)
            try:
                conn.request(self.command, self.path, body=body, headers=headers)
                resp = conn.getresponse()
                data = resp.read()
                self.send_response(resp.status)
                for k, v in resp.getheaders():
                    if k.lower() in ("transfer-encoding", "connection", "content-length"):
                        continue
                    self.send_header(k, v)
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)
            finally:
                conn.close()

    if __name__ == "__main__":
        port = int(os.environ.get("PORT", "8080"))
        print(f"nemo http proxy upstream=https://{UPSTREAM}:{UPSTREAM_PORT} port={port}", flush=True)
        ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wings3-nemo-http-proxy
  namespace: nemo-quickstart
  labels:
    app: wings3-nemo-http-proxy
    app.kubernetes.io/part-of: wings3-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wings3-nemo-http-proxy
  template:
    metadata:
      labels:
        app: wings3-nemo-http-proxy
    spec:
      containers:
        - name: proxy
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["python3", "/app/proxy.py"]
          env:
            - name: UPSTREAM_HOST
              value: nemoguardrails.nemo-quickstart.svc.cluster.local
            - name: UPSTREAM_PORT
              value: "443"
            - name: SSL_CERT_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: proxy
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: proxy
          configMap:
            name: wings3-nemo-http-proxy
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: wings3-nemo-http-proxy
  namespace: nemo-quickstart
  labels:
    app: wings3-nemo-http-proxy
    app.kubernetes.io/part-of: wings3-demo
spec:
  selector:
    app: wings3-nemo-http-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
