# Lab InferenceService for WINGS3. Runtime image comes from the cluster
# template vllm-cuda-runtime-template (bootstrap instantiates ServingRuntime
# llama-32-3b-instruct). Do not freeze an old RHAIIS SHA here.
#
# storageUri copied from the live catalog deploy on sandbox956
# (oci modelcar). Tool-calling args are required for Llama 3.2 3B.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama-32-3b-instruct
  namespace: my-first-model
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: llama-32-3b-instruct
    opendatahub.io/model-type: generative
    serving.kserve.io/deploymentMode: Standard
    opendatahub.io/hardware-profile-name: gpu-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: vLLM
      runtime: llama-32-3b-instruct
      storageUri: oci://quay.io/redhat-ai-services/modelcar-catalog:llama-3.2-3b-instruct
      args:
        - --dtype=half
        - --max-model-len=20000
        - --gpu-memory-utilization=0.95
        - --enable-auto-tool-choice
        - --tool-call-parser=llama3_json
        - --chat-template=/opt/app-root/template/tool_chat_template_llama3.2_json.jinja
      resources:
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "1"
          memory: 6Gi
          nvidia.com/gpu: "1"
