# Hosted MaaS judge for Module 4 Correctness / Guidelines.
# Agent stays on in-cluster llama-32-3b-instruct (MAAS_*). Do not put a real
# token in git. Fill JUDGE_API_KEY at apply time, or:
#
#   oc apply -f manifests/secret-wings3-judge-llm.yaml
#   oc set env secret/wings3-judge-llm -n my-first-model JUDGE_API_KEY='<token>'
#   # then stop/start workbench wings3-demo so the Notebook picks up env
#
# Other models on this endpoint: deepseek-r1-distill-qwen-14b, llama-scout-17b
# (change JUDGE_MODEL, then restart the workbench).
#
# Re-applying this file overwrites the live Secret, including a key you already
# set. Bootstrap creates the Secret only when it is missing.
apiVersion: v1
kind: Secret
metadata:
  name: wings3-judge-llm
  namespace: my-first-model
  labels:
    app.kubernetes.io/part-of: wings3
type: Opaque
stringData:
  JUDGE_BASE_URL: "https://maas-rhdp.apps.maas.redhatworkshops.io/v1"
  JUDGE_MODEL: "gpt-oss-120b"
  JUDGE_API_KEY: ""
