# S3 credentials for the demo MinIO instance (maas-usage-logging-minio.yaml).
# Not secret-worthy credentials (dev-only); never point this at a real bucket.
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/part-of: wings-demo
type: Opaque
stringData:
  access_key_id: minio
  access_key_secret: minio123
  bucketnames: loki
  endpoint: http://minio.redhat-ods-monitoring.svc:9000
  region: us-east-1
