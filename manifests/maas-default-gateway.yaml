# MaaS expects Gateway openshift-ingress/maas-default-gateway. On sandboxes that only
# have openshift-ai-inference, this mirrors that gateway for MaaS HTTPRoutes.
# Cluster admins may already provide this; install applies only when missing.
#
# infrastructure.parametersRef → ConfigMap maas-default-gateway-config forces
# ClusterIP (see that manifest). Default LoadBalancer never gets an address here.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: wings-demo
  annotations:
    opendatahub.io/managed: "false"
    security.opendatahub.io/authorino-tls-bootstrap: "true"
spec:
  # Prefer data-science-gateway-class when present (RHOAI 3.5 GatewayConfig).
  # install/ensure_maas_gateway may rewrite this if openshift-ai-inference exists.
  gatewayClassName: data-science-gateway-class
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: maas-default-gateway-config
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: REPLACE_MAAS_GATEWAY_HOST
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: maas-default-gateway-service-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - openshift-ingress
                  - redhat-ods-applications
                  - redhat-ai-gateway-infra
                  - my-first-model
                  - models-as-a-service
