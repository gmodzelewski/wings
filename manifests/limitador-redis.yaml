# Dev Redis backend so Limitador rate-limit / usage counters survive pod
# restarts. Non-HA, no persistence (memory-only Redis) — for production,
# use Redis Enterprise, Amazon ElastiCache, or Dragonfly instead and update
# the redis-config Secret URL.
apiVersion: v1
kind: Namespace
metadata:
  name: redis-limitador
  labels:
    app.kubernetes.io/part-of: wings-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: redis-limitador
  labels:
    app: redis
    app.kubernetes.io/part-of: wings-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: registry.redhat.io/rhel9/redis-7
          args:
            - /usr/bin/run-redis
            - --save ""
            - --appendonly no
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: redis-limitador
  labels:
    app: redis
    app.kubernetes.io/part-of: wings-demo
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
