# redis-config Secret lives in kuadrant-system (where Limitador runs), which
# only exists after Kuadrant/Connectivity Link is installed — apply this
# after limitador-redis.yaml and after ensure_kuadrant, never before.
apiVersion: v1
kind: Secret
metadata:
  name: redis-config
  namespace: kuadrant-system
  labels:
    app.kubernetes.io/part-of: wings-demo
type: Opaque
stringData:
  URL: "redis://redis-service.redis-limitador.svc:6379"
