# Agent (MAAS_*) and judge (JUDGE_*) LLM endpoints for workbench notebooks.
# Default agent: in-cluster llama-32-3b-instruct. Judges: in-cluster MaaS gpt-oss-120b.
# install.sh patches MAAS_* and JUDGE_* to gpt-oss-120b on MaaS clusters (e.g. stormshift).
#
#   cp manifests/secret-wings-judge-llm.example.yaml manifests/secret-wings-judge-llm.yaml
#   oc apply -f manifests/secret-wings-judge-llm.yaml   # first apply only
#
# After the secret exists, set keys without dropping MAAS_*:
#   oc set env secret/wings-judge-llm -n my-first-model \
#     JUDGE_API_KEY='<minted-maas-key>' MAAS_API_KEY='<minted-maas-key>'
# Or re-run ./install.sh --skip-llm (mints key + probes gateway).
#
# Other models on the MaaS subscription: change JUDGE_MODEL, then restart the workbench.
apiVersion: v1
kind: Secret
metadata:
  name: wings-judge-llm
  namespace: my-first-model
  labels:
    app.kubernetes.io/part-of: wings-demo
type: Opaque
stringData:
  MAAS_MODEL: "llama-32-3b-instruct"
  MAAS_BASE_URL: "http://llama-32-3b-instruct-predictor.my-first-model.svc.cluster.local:8080/v1"
  MAAS_API_KEY: "unused"
  JUDGE_BASE_URL: "https://REPLACE_AT_INSTALL/my-first-model/gpt-oss-120b/v1"
  JUDGE_MODEL: "gpt-oss-120b"
  JUDGE_API_KEY: ""
