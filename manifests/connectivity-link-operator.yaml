# Red Hat Connectivity Link (Kuadrant) — MaaS / Authorino prerequisite.
# Subscription only — uses existing global-operators OG in openshift-operators.
# Do NOT add another OperatorGroup here (OLM allows one per namespace).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: wings3-demo
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
